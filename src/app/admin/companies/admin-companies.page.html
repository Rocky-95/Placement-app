<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Manage Drives</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openForm()"><ion-icon name="add" slot="icon-only"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let c of companies" class="card">
    <ion-card-content>
      <div class="row">
        <div class="logo" [style.background]="c.color">{{ c.name.charAt(0) }}</div>
        <div class="info">
          <b>{{ c.name }}</b>
          <span>{{ c.role }}</span>
          <small>Min CGPA {{ c.minCgpa }} · Max arrears {{ c.maxArrears }}</small>
        </div>
        <div class="acts">
          <ion-button fill="clear" size="small" (click)="openForm(c)">
            <ion-icon name="create" slot="icon-only" color="primary"></ion-icon>
          </ion-button>
          <ion-button fill="clear" size="small" (click)="confirmDelete(c)">
            <ion-icon name="trash" slot="icon-only" color="danger"></ion-icon>
          </ion-button>
        </div>
      </div>
      <div class="meta">
        <span><ion-icon name="cash"></ion-icon> ₹{{ c.ctc }} LPA</span>
        <span><ion-icon name="location"></ion-icon> {{ c.location }}</span>
        <span [class.urgent]="days(c.deadline) <= 5 && days(c.deadline) > 0">
          <ion-icon name="time"></ion-icon>
          {{ days(c.deadline) > 0 ? days(c.deadline) + 'd left' : 'Closed' }}
        </span>
        <span><ion-icon name="people"></ion-icon> {{ applicants(c.id) }} applied</span>
      </div>
    </ion-card-content>
  </ion-card>

  <div *ngIf="!companies.length" class="empty">
    <ion-icon name="briefcase"></ion-icon>
    <p>No drives yet — tap + to publish one.</p>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openForm()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
